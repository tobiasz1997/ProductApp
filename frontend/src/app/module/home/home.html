<h1 class="title">Products</h1>
<div>
  <p-table
    [value]="products()"
    stripedRows
    [loading]="isProductLoading()"
    [paginator]="true"
    [rows]="pageSize()"
    [totalRecords]="total()"
    [first]="page() * pageSize()"
    [lazy]="true"
    [rowsPerPageOptions]="[10, 20]"
    (onLazyLoad)="onLazyLoad($event)"
  >
    <ng-template #header>
      <tr>
        <th>Title</th>
        <th>Category</th>
        <th>Price</th>
        <th>Favourite</th>
      </tr>
    </ng-template>
    <ng-template #body let-product>
      <tr>
        <td>{{ product.title }}</td>
        <td>{{ product.category }}</td>
        <td>{{ product.price | currency:'USD' }}</td>
        <td><app-favourite-button [productId]="product.id"></app-favourite-button></td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr class="table__empty">
        <td colspan="4">No products.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
