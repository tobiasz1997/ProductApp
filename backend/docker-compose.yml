name: productApp

services:
  mariadb:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: productapp_db
      MARIADB_USER: sa
      MARIADB_PASSWORD: nicepassword
      TZ: Europe/Warsaw
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MARIADB_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: adminer
    restart: unless-stopped
    depends_on:
      - mariadb
    ports:
      - "8080:8080"

volumes:
  mariadb_data:
